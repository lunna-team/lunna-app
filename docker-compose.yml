services:
  metro:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: lunna-metro
    ports:
      - "8081:8081"    # Metro bundler
      - "19000:19000"  # Expo Go protocol
      - "19001:19001"  # Expo DevTools
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      # Set HOST_IP to your machine's LAN IP so physical devices can connect:
      # HOST_IP=$(ipconfig getifaddr en0) docker-compose up metro  (macOS)
      # HOST_IP=$(hostname -I | awk '{print $1}') docker-compose up metro  (Linux)
      - REACT_NATIVE_PACKAGER_HOSTNAME=${HOST_IP:-localhost}
    restart: unless-stopped

volumes:
  node_modules:
